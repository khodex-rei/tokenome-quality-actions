name: python-quality
description: >-
  Python quality gates for uv-managed repos.
  Runs ruff format --check, isort --check-only, ruff check, mypy.
author: khodex-rei

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.11"
  sync-args:
    description: Arguments passed to uv sync
    required: false
    default: --extra dev
  paths:
    description: Paths for ruff/isort checks
    required: false
    default: src tests
  mypy-targets:
    description: >-
      Targets for mypy. Empty = bare `uv run mypy` (uses repo mypy config).
    required: false
    default: ""
  working-directory:
    description: Directory to run in
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Python + uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Sync dependencies
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.sync-args }}
      shell: bash

    - name: Quality gates
      working-directory: ${{ inputs.working-directory }}
      env:
        PATHS: ${{ inputs.paths }}
        MYPY_TARGETS: ${{ inputs.mypy-targets }}
      run: |
        uv run ruff format --check ${PATHS}
        uv run isort --check-only ${PATHS}
        uv run ruff check ${PATHS}
        if [ -n "${MYPY_TARGETS}" ]; then
          uv run mypy ${MYPY_TARGETS}
        else
          uv run mypy
        fi
      shell: bash
