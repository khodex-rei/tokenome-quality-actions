name: pre-commit-check
description: >-
  Run pre-commit hooks in check mode across all files.
  Sets up Python/uv or Node/pnpm per the language input.
author: khodex-rei

inputs:
  language:
    description: Ecosystem for toolchain setup (python or node)
    required: false
    default: python
  python-version:
    description: Python version for language=python
    required: false
    default: "3.11"
  sync-args:
    description: Arguments passed to uv sync
    required: false
    default: --extra dev
  node-version:
    description: Node version for language=node
    required: false
    default: "22"
  working-directory:
    description: Directory to run pre-commit in
    required: false
    default: .
  extra-args:
    description: Extra arguments for pre-commit run
    required: false
    default: --all-files

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Python + uv
      if: inputs.language == 'python'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Sync Python dependencies
      if: inputs.language == 'python'
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.sync-args }}
      shell: bash

    - name: Setup pnpm
      if: inputs.language == 'node'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10
        run_install: false

    - name: Setup Node
      if: inputs.language == 'node'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install Node dependencies
      if: inputs.language == 'node'
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Setup Python for pre-commit
      if: inputs.language == 'node'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"

    - name: Install pre-commit
      if: inputs.language == 'node'
      run: python -m pip install pre-commit
      shell: bash

    - name: Run pre-commit
      working-directory: ${{ inputs.working-directory }}
      run: pre-commit run ${{ inputs.extra-args }}
      shell: bash
