name: node-quality
description: >-
  Node quality gates for pnpm-managed repos.
  Runs format:check, lint, tsc --noEmit.
author: khodex-rei

inputs:
  node-version:
    description: Node version
    required: false
    default: "22"
  working-directory:
    description: Directory to run in
    required: false
    default: .
  app:
    description: >-
      Optional pnpm --filter scope (e.g. @tokenome/web).
      Empty = run at workspace root.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Quality gates
      working-directory: ${{ inputs.working-directory }}
      env:
        APP: ${{ inputs.app }}
      run: |
        filter=""
        if [ -n "${APP}" ]; then
          filter="--filter ${APP}"
        fi
        pnpm ${filter} run format:check
        pnpm ${filter} run lint
        pnpm ${filter} exec tsc --noEmit
      shell: bash
