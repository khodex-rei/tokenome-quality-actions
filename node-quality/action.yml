name: node-quality
description: >-
  Node quality gates for pnpm- or npm-managed repos (autodetected from lockfile).
  Runs format:check, lint, tsc --noEmit.
author: khodex-rei

inputs:
  node-version:
    description: Node version
    required: false
    default: "22"
  working-directory:
    description: Directory to run in
    required: false
    default: .
  app:
    description: >-
      Optional workspace scope (e.g. @tokenome/web).
      pnpm: passed as --filter. npm: passed as --workspace.
      Empty = run at workspace root.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Detect package manager
      id: pm
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f pnpm-lock.yaml ]; then
          echo "pm=pnpm" >> "$GITHUB_OUTPUT"
        elif [ -f package-lock.json ]; then
          echo "pm=npm" >> "$GITHUB_OUTPUT"
        else
          echo "No pnpm-lock.yaml or package-lock.json in ${{ inputs.working-directory }}" >&2
          exit 1
        fi
      shell: bash

    - name: Setup pnpm
      if: steps.pm.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.pm.outputs.pm }}

    - name: Install dependencies (pnpm)
      if: steps.pm.outputs.pm == 'pnpm'
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Install dependencies (npm)
      if: steps.pm.outputs.pm == 'npm'
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
      shell: bash

    - name: Quality gates
      working-directory: ${{ inputs.working-directory }}
      env:
        APP: ${{ inputs.app }}
        PM: ${{ steps.pm.outputs.pm }}
      run: |
        # Clear stale Next.js typegen before gating (breaks tsc in reused worktrees).
        find . -type d -name node_modules -prune -o -type d -name .next -exec rm -rf {} + 2>/dev/null || true

        if [ "${PM}" = "pnpm" ]; then
          filter=""
          if [ -n "${APP}" ]; then
            filter="--filter ${APP}"
          fi
          pnpm ${filter} run format:check
          pnpm ${filter} run lint
          pnpm ${filter} exec tsc --noEmit
        else
          npm run format:check
          if [ -n "${APP}" ]; then
            npm run lint --workspace="${APP}"
            npm run check-types --workspace="${APP}"
          else
            npm run lint
            npx tsc --noEmit
          fi
        fi
      shell: bash
